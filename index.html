<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Consent Demo</title>
<script>window.dataLayer=window.dataLayer||[];window.dataLayer.push({'gtm.start':Date.now(),event:'gtm.js'});(function(w,d,s,l,i){var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f)})(window,document,'script','dataLayer','GTM-PNTP8W4W')</script>
<style>:root{--ink:#12352a;--forest:#0f6b45;--mint:#e3f5ea;--line:#9bc8aa;--surface:#f8fcf8}body{font:16px system-ui;margin:0;background:var(--mint);color:var(--ink)}main{max-width:780px;margin:auto;padding:72px 24px}section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;margin:22px 0}button,input{padding:12px;margin:6px;border-radius:7px;border:1px solid var(--line)}button{background:var(--forest);color:#f4fff7;border-color:var(--forest);font-weight:700}footer{margin-top:72px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#edf8ef;padding:12px;border-radius:8px}a{color:var(--forest);font-weight:700}</style></head>
<body><main><p>DEMO PROPERTY / 01</p><h1>Atlas Journal</h1>
<section id="login"><h2>Sign in</h2><input id="email" value="alex@example.com"><input id="password" type="password" value="demo"><button onclick="loginUser()">Sign in as Alex</button><p id="message"></p></section>
<section id="profile" hidden><h2>Authenticated consent profile</h2><p id="identity"></p><p id="status">Consent choices are controlled by the OneTrust banner and preference centre.</p><pre id="jwt"></pre><button onclick="logoutUser()">Sign out</button><button onclick="location.href='https://onetrust-orbit-demo.pages.dev/'">Open Orbit Shop →</button></section>
<footer>Your choices are controlled by OneTrust. <button onclick="openPrivacyChoices()">Privacy choices</button><a href="https://onetrust-kms-console.cyberprivacytest-gt.workers.dev/" target="_blank" rel="noopener">Open KMS console</a></footer></main>
<script>const KMS='https://onetrust-demo-kms.cyberprivacytest-gt.workers.dev';let session;async function loginUser(){const r=await fetch(KMS+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});session=await r.json();if(!r.ok){message.textContent=session.error;return}sessionStorage.setItem('crossDeviceDemoSession',JSON.stringify(session));location.reload()}function logoutUser(){sessionStorage.removeItem('crossDeviceDemoSession');location.reload()}function openPrivacyChoices(){const open=window.OneTrust?.ToggleInfoDisplay||window.Optanon?.ToggleInfoDisplay;if(open)open();else message.textContent='The OneTrust preference centre is still loading.'}session=JSON.parse(sessionStorage.getItem('crossDeviceDemoSession')||'null');if(session){dataLayer.push({event:'authenticatedUser',authenticatedUserId:session.user.id});login.hidden=true;profile.hidden=false;identity.textContent=session.user.name+' · '+session.user.id;jwt.textContent=session.jwt}document.addEventListener('OneTrustGroupsUpdated',()=>{status.textContent='OneTrust active categories: '+(window.OnetrustActiveGroups||'none')})</script></body></html>
